name: Teste Unitário para Tarefa

on:
  push:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check code
        uses: actions/checkout@v4

      - name: Configurar o JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Conceder permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar os testes unitários
        run: ./mvnw -B test